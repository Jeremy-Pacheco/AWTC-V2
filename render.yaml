# Render Blueprint for the AWTC public demo backend (Express + Socket.IO + EJS).
# Full guide: docs/deploy-demo.md
#
# Values marked `sync: false` are asked for when the Blueprint is created
# in the Render dashboard; they are never stored in this file.
services:
  - type: web
    name: awtc-backend
    runtime: node
    plan: free
    rootDir: backend
    # Render's free plan has no pre-deploy step, so migrations run in the build
    buildCommand: npx --yes pnpm@12.23.0 install --frozen-lockfile --prod && npx --yes sequelize-cli@6 db:migrate
    startCommand: node index.js
    healthCheckPath: /api/demo
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: AUTH_PROVIDER
        value: local
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: DB_SSL
        value: "true"
      # Secrets generated by Render (random, long)
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Asked for on creation
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      # Aiven CA certificate (ca.pem) so the TLS certificate is verified
      - key: DB_SSL_CA
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false
